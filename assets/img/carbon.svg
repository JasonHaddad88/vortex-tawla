<?xml version="1.0" encoding="UTF-8"?>
<!--
  Carbon fibre, 2/2 twill.

  Real carbon cloth is bundles of fibre woven over-under in blocks, so
  the weave reads as a checkerboard where adjacent blocks run at ninety
  degrees to each other. Each block gets a gradient ACROSS the bundle
  (bright in the middle, dark at the edges) because that is where the
  sheen comes from — a flat two-tone checkerboard looks like tiles, not
  cloth — plus fine striations along the fibre direction.

  Drawn as an opaque image rather than a mask: it needs two tones and a
  highlight, which a mask cannot carry. Tiles seamlessly at any size; the
  app uses it large for the page ground and small on the checkers.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <defs>
    <!-- sheen across a vertical bundle -->
    <linearGradient id="v" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#0a0b0d"/>
      <stop offset="0.5"  stop-color="#2c3138"/>
      <stop offset="1"    stop-color="#0a0b0d"/>
    </linearGradient>
    <!-- and across a horizontal one -->
    <linearGradient id="h" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#0a0b0d"/>
      <stop offset="0.5"  stop-color="#2c3138"/>
      <stop offset="1"    stop-color="#0a0b0d"/>
    </linearGradient>

    <!-- individual filaments, along the bundle -->
    <pattern id="fv" width="2.5" height="2.5" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="2.5" stroke="#000" stroke-opacity=".22" stroke-width=".9"/>
    </pattern>
    <pattern id="fh" width="2.5" height="2.5" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="2.5" y2="0" stroke="#000" stroke-opacity=".22" stroke-width=".9"/>
    </pattern>
  </defs>

  <rect width="40" height="40" fill="#141619"/>

  <!-- the twill: vertical bundles on one diagonal, horizontal on the other -->
  <rect x="0"  y="0"  width="20" height="20" fill="url(#v)"/>
  <rect x="20" y="20" width="20" height="20" fill="url(#v)"/>
  <rect x="20" y="0"  width="20" height="20" fill="url(#h)"/>
  <rect x="0"  y="20" width="20" height="20" fill="url(#h)"/>

  <rect x="0"  y="0"  width="20" height="20" fill="url(#fv)"/>
  <rect x="20" y="20" width="20" height="20" fill="url(#fv)"/>
  <rect x="20" y="0"  width="20" height="20" fill="url(#fh)"/>
  <rect x="0"  y="20" width="20" height="20" fill="url(#fh)"/>

  <!-- seams between blocks, so the weave has depth rather than sitting flat -->
  <g stroke="#000" stroke-opacity=".45" stroke-width="1" shape-rendering="crispEdges">
    <line x1="20" y1="0" x2="20" y2="40"/>
    <line x1="0" y1="20" x2="40" y2="20"/>
    <line x1="0" y1="0" x2="40" y2="0"/>
    <line x1="0" y1="0" x2="0" y2="40"/>
  </g>
</svg>
